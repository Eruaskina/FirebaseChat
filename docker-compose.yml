services:
  chat-app:
    build:
      context: https://github.com/Eruaskina/FirebaseChat.git#main
      dockerfile: Dockerfile
    container_name: firebase-pulse-chat
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
